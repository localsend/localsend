display_name: LocalSend
package_name: localsend
maintainer:
  name: Tienisto
  email: dev.tien.donam@gmail.com
co_authors:
  - name: TheGB0077
    email: gb.lima.dev@gmail.com
priority: optional
section: x11
installed_size: 30600
essential: false
icon: assets/img/logo-512.png

pre_dependencies:
  - libc6 (>= 2.31)

dependencies:
  - libappindicator3-1 | libayatana-appindicator3-1
  - gir1.2-appindicator3-0.1 | gir1.2-ayatanaappindicator3-0.1
  - libayatana-ido3-0.4-0
  - xdg-user-dirs

postinstall_scripts:
  - mkdir -p /usr/share/kio/servicemenus /usr/share/kservices5/ServiceMenus
  - ln -sf /opt/localsend_app/share/kio/servicemenus/localsend_app.desktop /usr/share/kio/servicemenus/localsend_app.desktop
  - ln -sf /opt/localsend_app/share/kio/servicemenus/localsend_app.desktop /usr/share/kservices5/ServiceMenus/localsend_app.desktop
  - echo "Installed Localsend successfully"
postuninstall_scripts:
  - rm -f /usr/share/kio/servicemenus/localsend_app.desktop /usr/share/kservices5/ServiceMenus/localsend_app.desktop
  - if [ "$1" = "remove" ]; then echo "Sorry to see you go :("; fi

keywords:
  - Sharing
  - LAN
  - Files

generic_name: An open source cross-platform alternative to AirDrop

categories:
  - GTK
  - FileTransfer
  - Utility

startup_notify: true
