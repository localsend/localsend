name: Build windows exe

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_windows_exe:
    needs: build
    runs-on: windows-latest
    environment: packaging

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      # The MSIX publisher must match the subject of the signing certificate.
      # The manifests in the repo carry the release certificate subject; test-signing
      # uses SignPath's self-issued test certificate, so patch both manifests here.
      - name: Patch MSIX publisher for test certificate
        run: |
          $subject = 'CN=Test certificate for ''LocalSend [OSS]'''
          $manifest = 'support\build\msix\content\AppxManifest.xml'
          $exeManifest = 'app\windows\localsend_app.exe.manifest'
          (Get-Content $manifest -Raw) -creplace 'Publisher="[^"]+"', ('Publisher="' + $subject + '"') | Set-Content $manifest -Encoding utf8
          (Get-Content $exeManifest -Raw) -creplace 'publisher="[^"]+"', ('publisher="' + $subject + '"') | Set-Content $exeManifest -Encoding utf8

      - name: Build MSIX helper
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix

      # The sparse package needs its own signature (Add-AppxPackage rejects unsigned packages)
      - name: Upload unsigned MSIX helper
        id: unsigned-msix
        uses: actions/upload-artifact@v6
        with:
          name: windows-msix-helper-unsigned
          path: app\windows\localsend_msix_helper.msix
          if-no-files-found: error

      - name: Sign MSIX helper (SignPath)
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: localsend
          signing-policy-slug: test-signing
          artifact-configuration-slug: msix-helper
          github-artifact-id: ${{ steps.unsigned-msix.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/msix-helper

      - name: Replace MSIX helper with signed version
        run: Copy-Item -Force signed\msix-helper\localsend_msix_helper.msix app\windows\localsend_msix_helper.msix

      - name: Verify MSIX signature
        continue-on-error: true
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Select-Object -Last 1
          & $signtool.FullName verify /pa /v app\windows\localsend_msix_helper.msix

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows

      - name: Prepare Inno Setup payload
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno" | Out-Null
          Copy-Item -Path "app\build\windows\x64\runner\Release\*" -Destination "${{ runner.temp }}\inno" -Recurse
          Copy-Item -Path "app\assets\packaging\logo.ico" -Destination "${{ runner.temp }}\inno"
          Copy-Item -Path "support\build\windows\x64\*" -Destination "${{ runner.temp }}\inno" -Recurse
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno-result" | Out-Null

      - name: Compile installer (unsigned)
        run: iscc /DSkipSignTool "/DPayloadDir=${{ runner.temp }}\inno" "/DResultDir=${{ runner.temp }}\inno-result" support\scripts\compile_windows_exe-inno.iss

      # The SignPath artifact configuration expects "LocalSend-*-windows-x86-64.exe"
      - name: Rename installer
        run: Rename-Item -Path "${{ runner.temp }}\inno-result\localsend.exe" -NewName "LocalSend-${{ needs.build.outputs.version }}-windows-x86-64.exe"

      - name: Upload unsigned installer
        id: unsigned-installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe-unsigned
          path: ${{ runner.temp }}\inno-result\LocalSend-${{ needs.build.outputs.version }}-windows-x86-64.exe
          if-no-files-found: error

      - name: Sign installer (SignPath)
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: localsend
          signing-policy-slug: test-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/installer

      - name: Verify signature
        continue-on-error: true
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Select-Object -Last 1
          & $signtool.FullName verify /pa /v "signed\installer\LocalSend-${{ needs.build.outputs.version }}-windows-x86-64.exe"

      - name: Upload signed installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe-x86-64-result
          path: signed/installer/LocalSend-${{ needs.build.outputs.version }}-windows-x86-64.exe
