name: Compile APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_apk:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Cache build dependencies (pub / gradle / cargo)
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.APK_BUILD_DIR }}/packages/core/target
            ${{ env.APK_BUILD_DIR }}/packages/localsend_isolates/rust/target
            ${{ env.APK_BUILD_DIR }}/server/target
          key: ${{ runner.os }}-localsend-deps-${{ hashFiles('**/pubspec.lock', '**/Cargo.lock', 'packages/core/Cargo.toml', 'packages/localsend_isolates/rust/Cargo.toml', 'server/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-localsend-deps-

      - name: Decode key.properties file
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: echo $ENCODED_STRING | base64 -di > app/android/key.properties

      - name: Decode android-keystore.jks file
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_STORE }}
        run: mkdir -p app/android/secrets && echo $ENCODED_STRING | base64 -di > app/android/secrets/android-keystore.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Build APK (split per ABI)
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --split-per-abi

      - name: Build universal APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TAG="v$VERSION"
          # idempotent: remove prior release/tag if present (allows safe re-runs)
          gh release delete "$TAG" --repo ${{ github.repository }} --yes 2>/dev/null || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "LocalSend v$VERSION (self-use)" \
            --notes "Self-use build — Windows + Android only. Signed release APKs (arm64-v8a / armeabi-v7a / x86_64 / universal)." \
            "$APK_BUILD_DIR/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" \
            "$APK_BUILD_DIR/app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" \
            "$APK_BUILD_DIR/app/build/app/outputs/flutter-apk/app-x86_64-release.apk" \
            "$APK_BUILD_DIR/app/build/app/outputs/flutter-apk/app-release.apk"

      - name: Upload APK (artifact fallback)
        uses: actions/upload-artifact@v6
        with:
          name: apk-result
          path: |
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-release.apk
