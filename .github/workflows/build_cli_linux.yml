name: Build CLI for Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_cli:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            suffix: linux-x86-64
          - runner: ubuntu-22.04-arm
            suffix: linux-arm-64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      # cli/ uses edition 2024; the preinstalled toolchain on the runner may be outdated
      - name: Update Rust
        run: rustup update stable

      - name: Compile CLI
        run: cargo build --release --package localsend-cli

      - name: Rename CLI executable
        run: mv target/release/localsend-cli target/release/LocalSend-CLI-${{ needs.build.outputs.version }}-${{ matrix.suffix }}

      - name: Upload CLI
        uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.suffix }}-result
          path: target/release/LocalSend-CLI-${{ needs.build.outputs.version }}-${{ matrix.suffix }}
          if-no-files-found: error
