name: Build windows exe (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"
  # Pin the pub cache to a known path so it can be cached (Windows default is
  # %LOCALAPPDATA%\Pub\Cache, which actions/cache cannot address portably).
  PUB_CACHE: ${{ runner.temp }}/pub-cache

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_windows_exe_x86_64:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache build dependencies (pub / cargo)
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/pub-cache
            ~/.cargo/registry
            ~/.cargo/git
            packages/core/target
            packages/localsend_isolates/rust/target
            server/target
          key: ${{ runner.os }}-localsend-windows-deps-${{ hashFiles('**/pubspec.lock', '**/Cargo.lock', 'packages/core/Cargo.toml', 'packages/localsend_isolates/rust/Cargo.toml', 'server/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-localsend-windows-deps-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      # Required by the CMake install step (app/windows/CMakeLists.txt installs localsend_msix_helper.msix)
      - name: Build MSIX helper
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows

      - name: Prepare Inno Setup payload
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno" | Out-Null
          Copy-Item -Path "app\build\windows\x64\runner\Release\*" -Destination "${{ runner.temp }}\inno" -Recurse
          Copy-Item -Path "app\assets\packaging\logo.ico" -Destination "${{ runner.temp }}\inno"
          Copy-Item -Path "support\build\windows\x64\*" -Destination "${{ runner.temp }}\inno" -Recurse
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno-result" | Out-Null

      # SkipMsixHelper: the helper would be unsigned and Add-AppxPackage rejects unsigned packages
      - name: Compile installer (unsigned)
        run: iscc /DSkipSignTool /DSkipMsixHelper "/DPayloadDir=${{ runner.temp }}\inno" "/DResultDir=${{ runner.temp }}\inno-result" support\scripts\compile_windows_exe-inno.iss

      - name: Rename installer
        run: Rename-Item -Path "${{ runner.temp }}\inno-result\localsend.exe" -NewName "LocalSend-${{ needs.build.outputs.version }}-windows-x86-64.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe-x86-64-unsigned
          path: ${{ runner.temp }}\inno-result\LocalSend-${{ needs.build.outputs.version }}-windows-x86-64.exe
          if-no-files-found: error

      - name: Upload installer to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TAG="v$VERSION"
          # Reuse an existing release: the APK workflow may have created it already.
          # Never delete the release here — that would also drop the APK assets.
          gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1 \
            || gh release create "$TAG" \
              --repo ${{ github.repository }} \
              --title "LocalSend v$VERSION (self-use)" \
              --notes "Self-use build — Windows + Android only."
          gh release upload "$TAG" \
            --repo ${{ github.repository }} \
            --clobber \
            "${{ runner.temp }}/inno-result/LocalSend-$VERSION-windows-x86-64.exe"
