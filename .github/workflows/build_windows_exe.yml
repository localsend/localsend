name: Build windows exe

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_windows_exe:
    needs: build
    runs-on: windows-latest
    environment: packaging
    permissions:
      id-token: write # OIDC token for Azure login
      contents: read

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build MSIX helper
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix

      # The sparse package needs its own signature (Add-AppxPackage rejects unsigned packages);
      # signing the surrounding installer does not cover it. Sign before "flutter build windows"
      # so CMake bundles the signed msix into the Release directory.
      - name: Sign MSIX helper (Azure Trusted Signing)
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: https://neu.codesigning.azure.net/
          trusted-signing-account-name: tienisto
          certificate-profile-name: localsend
          files-folder: ${{ github.workspace }}\app\windows
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify MSIX signature
        continue-on-error: true
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Select-Object -Last 1
          & $signtool.FullName verify /pa /v app\windows\localsend_msix_helper.msix

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows

      - name: Sign app binaries (Azure Trusted Signing)
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: https://neu.codesigning.azure.net/
          trusted-signing-account-name: tienisto
          certificate-profile-name: localsend
          files-folder: ${{ github.workspace }}\app\build\windows\x64\runner\Release
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Prepare Inno Setup payload
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno" | Out-Null
          Copy-Item -Path "app\build\windows\x64\runner\Release\*" -Destination "${{ runner.temp }}\inno" -Recurse
          Copy-Item -Path "app\assets\packaging\logo.ico" -Destination "${{ runner.temp }}\inno"
          Copy-Item -Path "support\build\windows\x64\*" -Destination "${{ runner.temp }}\inno" -Recurse
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno-result" | Out-Null

      # Inno signs the setup exe AND the embedded uninstaller at compile time via the MySignTool
      # command; signing the finished installer afterwards would leave unins000.exe unsigned.
      - name: Prepare Trusted Signing sign tool for Inno Setup
        run: |
          $dir = "${{ runner.temp }}\trusted-signing"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          nuget install Microsoft.ArtifactSigning.Client -x -OutputDirectory $dir
          $dlib = "$dir\Microsoft.ArtifactSigning.Client\bin\x64\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path $dlib)) { Write-Error "Azure.CodeSigning.Dlib.dll not found"; exit 1 }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Select-Object -Last 1
          Set-Content "$dir\metadata.json" -Encoding ascii -Value @"
          {
            "Endpoint": "https://neu.codesigning.azure.net/",
            "CodeSigningAccountName": "tienisto",
            "CertificateProfileName": "localsend"
          }
          "@
          Set-Content "$dir\sign.cmd" -Encoding ascii -Value @"
          @echo off
          "$($signtool.FullName)" sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib "$dlib" /dmdf "$dir\metadata.json" %1
          "@

      - name: Compile installer (signed)
        run: iscc "/SMySignTool=${{ runner.temp }}\trusted-signing\sign.cmd `$f" "/DPayloadDir=${{ runner.temp }}\inno" "/DResultDir=${{ runner.temp }}\inno-result" support\scripts\compile_windows_exe-inno.iss

      - name: Rename installer
        run: Rename-Item -Path "${{ runner.temp }}\inno-result\localsend.exe" -NewName "LocalSend-${{ needs.build.outputs.version }}-windows-x86-64.exe"

      - name: Verify signature
        continue-on-error: true
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Select-Object -Last 1
          & $signtool.FullName verify /pa /v "${{ runner.temp }}\inno-result\LocalSend-${{ needs.build.outputs.version }}-windows-x86-64.exe"

      - name: Upload signed installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe-x86-64-result
          path: ${{ runner.temp }}\inno-result\LocalSend-${{ needs.build.outputs.version }}-windows-x86-64.exe
          if-no-files-found: error
