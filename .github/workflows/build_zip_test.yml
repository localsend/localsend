name: Build windows zip

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_windows_zip:
    needs: build
    runs-on: windows-latest
    environment: packaging

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      # Required by the CMake install step (app/windows/CMakeLists.txt installs localsend_msix_helper.msix)
      - name: Build MSIX helper
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows

      - name: Create empty settings.json
        working-directory: app
        run: echo {} > build/windows/x64/runner/Release/settings.json

      - name: Add DLL files
        working-directory: app
        run: |
          Copy-Item ../support/build/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      # The MSIX helper only makes sense for the installer; portable users should not register an MSIX package
      - name: Remove MSIX helper from portable bundle
        working-directory: app
        run: |
          Remove-Item build/windows/x64/runner/Release/localsend_msix_helper.msix
          Remove-Item build/windows/x64/runner/Release/install_msix_helper.ps1
          Remove-Item build/windows/x64/runner/Release/localsend_app.exe.manifest

      # The SignPath artifact configuration expects "LocalSend-*-windows-*-64.zip" containing "localsend_app.exe"
      - name: Zip compiled files
        working-directory: app
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "LocalSend-${{ needs.build.outputs.version }}-windows-x86-64.zip"

      - name: Upload unsigned zip
        id: unsigned-zip
        uses: actions/upload-artifact@v6
        with:
          name: windows-zip-unsigned
          path: app/LocalSend-${{ needs.build.outputs.version }}-windows-x86-64.zip
          if-no-files-found: error

      - name: Sign zip (SignPath)
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: localsend
          signing-policy-slug: test-signing
          artifact-configuration-slug: portable
          github-artifact-id: ${{ steps.unsigned-zip.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/portable

      - name: Verify signature
        continue-on-error: true
        run: |
          Expand-Archive -Path "signed\portable\LocalSend-${{ needs.build.outputs.version }}-windows-x86-64.zip" -DestinationPath verify-portable
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Select-Object -Last 1
          & $signtool.FullName verify /pa /v verify-portable\localsend_app.exe

      - name: Upload signed zip
        uses: actions/upload-artifact@v6
        with:
          name: windows-zip-x86-64-result
          path: signed/portable/LocalSend-${{ needs.build.outputs.version }}-windows-x86-64.zip
