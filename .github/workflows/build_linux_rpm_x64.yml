name: Build linux x64 rpm

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_rpm_x86_64:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: dnf install -y clang cmake gtk3-devel ninja-build libappindicator-gtk3-devel jq findutils which git patchelf rpm-build

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Configure safe directory for Git
        run: git config --global --add safe.directory "$FLUTTER_ROOT"

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Check rust-toolchain.toml
        working-directory: packages/localsend_isolates
        run: rustup show

      - name: Enable dart_distributor
        run: dart pub global activate flutter_distributor

      # Patch flutter_app_packager's hardcoded rpm spec and desktop entry:
      # - rpm 4.20+ runs %install in a per-package build subdirectory, while
      #   flutter_app_packager stages the bundle and desktop assets in its parent.
      #   Patch the Dart template variables and verify all four copy commands.
      # - The pixmap is installed setuid (4755); install it as 644.
      # - The rpm desktop entry has no StartupWMClass option. It must match the
      #   GTK application id in linux/CMakeLists.txt, otherwise the desktop
      #   environment cannot map the window to the entry and shows a generic icon.
      # - Name the desktop file after the application id too. KWin finds the
      #   window's desktop file by the Wayland app id alone, so with
      #   localsend_app.desktop the title bar shows a generic icon.
      - name: Patch flutter_app_packager
        run: |
          F=$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/flutter_app_packager-*/lib/src/makers/rpm/make_rpm_config.dart' | head -1)
          test -n "$F"
          sed -i 's|cp -r \$appName/|cp -r ../$appName/|; s|cp -r \$appBinaryName|cp -r ../$appBinaryName|g' "$F"
          test "$(grep -cF 'cp -r ../' "$F")" -eq 4
          sed -i "s|'(4755, root, root) %{_datadir}/pixmaps/|'(644, root, root) %{_datadir}/pixmaps/|" "$F"
          test "$(grep -cF "'(644, root, root) %{_datadir}/pixmaps/" "$F")" -eq 1
          sed -i "s|'StartupNotify': startupNotify,|&\n        'StartupWMClass': 'org.localsend.localsend_app',|" "$F"
          test "$(grep -cF "'StartupWMClass': 'org.localsend.localsend_app'," "$F")" -eq 1
          sed -i 's|applications/%{name}\.desktop|applications/org.localsend.localsend_app.desktop|g' "$F"
          test "$(grep -cF 'applications/org.localsend.localsend_app.desktop' "$F")" -eq 2
          dart pub global deactivate flutter_distributor
          dart pub global activate flutter_distributor

      - name: Build rpm package
        working-directory: app
        run: flutter_distributor package --platform linux --targets rpm

      - name: Find rpm file
        id: find_rpm
        run: |
          VERSION=${{ needs.build.outputs.version }}
          RPM_PATH=$(find app/dist -name "localsend_app-$VERSION*-linux.rpm")
          echo "rpm_path=$RPM_PATH" >> $GITHUB_OUTPUT

      - name: Check if rpm file exists
        id: check_file
        run: |
          if [ ! -f "${{ steps.find_rpm.outputs.rpm_path }}" ]; then
            echo "File not found: ${{ steps.find_rpm.outputs.rpm_path }}"
            exit 1
          fi

      - name: Upload rpm file
        uses: actions/upload-artifact@v6
        with:
          name: rpm-x86-64-result
          path: ${{ steps.find_rpm.outputs.rpm_path }}
