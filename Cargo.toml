[workspace]
resolver = "3"
members = [
    "cli",
    "packages/core",
    "packages/localsend_isolates/rust",
    "server",
]

# Profiles are only honored in the workspace root manifest.

# Full debuginfo dominates target/ size; line tables keep backtraces usable.
[profile.dev]
debug = "line-tables-only"

# RSA key generation is bignum-heavy and takes ~10x longer unoptimized;
# keep the crypto crates optimized in dev so tests stay fast.
[profile.dev.package.rsa]
opt-level = 2

[profile.dev.package.num-bigint-dig]
opt-level = 2

# Shipped builds (the Flutter app via cargokit, and the CLI) all use --release.
# Whole-program optimization produces smaller, faster binaries at the cost of
# longer release compile times. Do not add `panic = "abort"`: flutter_rust_bridge
# catches Rust panics and turns them into Dart exceptions.
[profile.release]
lto = "fat"
codegen-units = 1
